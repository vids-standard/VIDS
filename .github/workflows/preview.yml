name: PR site preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-site-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build and publish preview
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull request
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          
      - name: Install site dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs-material mkdocs-redirects

      - name: Build site strictly
        run: mkdocs build --strict

      - name: Prevent preview indexing
        run: |
          cat > site/_headers <<'EOF'
          /*
            X-Robots-Tag: noindex, nofollow, noarchive
          EOF

      - name: Deploy preview to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy site
            --project-name=vids-preview
            --branch=pr-${{ github.event.pull_request.number }}

      - name: Add or update preview comment
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.cloudflare.outputs['pages-deployment-alias-url'] }}
        with:
          script: |
            const marker = '<!-- vids-cloudflare-preview -->';
            const url = process.env.PREVIEW_URL;

            if (!url) {
              core.setFailed(
                'Cloudflare did not return a preview alias URL. Check the Wrangler action output.'
              );
              return;
            }

            const body = [
              marker,
              '### Website preview',
              '',
              'The latest version of this pull request is available at:',
              '',
              `**${url}**`,
              '',
              '_This preview is public but carries noindex headers. It updates whenever new commits are pushed to this PR._'
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );

            const existing = comments.find(
              comment =>
                comment.user?.type === 'Bot' &&
                comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
